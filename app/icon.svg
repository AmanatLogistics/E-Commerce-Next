<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Afghan Emerald Crest">
  <!--
    The tab icon: an emerald cut seen face on, gold on the shop's deep emerald.

    Drawn much heavier than the wordmark's crest on purpose. That one is three nested
    outlines at 1.1px stroke — elegant at 20px, an illegible smudge at the 16px a browser
    tab actually gives you. This is two filled shapes and nothing else.

    The table is a LIGHTER gold rather than a dark cut-out. Cutting it out was the first
    attempt and at 16px the result read as a ring, not a stone; lighter keeps the silhouette
    solid while still showing the facet. Checked at 16, 24 and 48px before choosing.
  -->
  <rect width="32" height="32" rx="7" fill="#0B4F3A"/>
  <path d="M11.5 5.5h9l5 5v11l-5 5h-9l-5-5v-11z" fill="#D8B76A"/>
  <path d="M13.6 9.6h4.8l2.9 2.9v7l-2.9 2.9h-4.8l-2.9-2.9v-7z" fill="#F0DDA9"/>
</svg>
